# Временный приём апдейтов long-polling-ом, пока Serverless-приложение не получило
# новый токен бота (тогда платформа ставит вебхук, поллер получает 409 и выходит сам).
# Публичный репозиторий — минуты Actions бесплатны. После перепривязки этот файл удаляется.
name: poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Подготовить секреты модулей
        run: node scripts/build-config.mjs
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      - name: Опрашивать getUpdates
        run: node scripts/poll.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          POLL_BUDGET_MS: '270000'
