name: keepalive
on:
  schedule:
    - cron: "*/20 * * * *"
workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake/keep HF Space alive
        run: |
          code=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            "https://${{ vars.HF_SPACE_HOST }}/health" || true)
          echo "health: $code"
