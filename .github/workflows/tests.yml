name: tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: unittest (sqlite)
        run: python -m unittest discover -s tests -p "test_iter*.py"
      - name: unittest (postgres)
        env:
          BOT_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/news
        run: python -m unittest discover -s tests -p "test_iter*.py"
